name: Tjek Kereby

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kereby
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Tjek for nye boliger
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 check_kereby.py
      - name: Gem hvad vi har set
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "kereby-bot"
            git config user.email "kereby-bot@users.noreply.github.com"
            git add seen.json
            git commit -m "Opdater sete boliger"
            git push
          fi
